<body class="about">

    <div class="about-text" id="scrubber-text">

    <div class="scrubber-track" id="scrubber-track">

    </div>
    <noscript>
    <style>.about-text{display:none}</style>
    <article style="color:rgba(255,255,255,0.9);padding:8vh 8vw;font-weight:300;line-height:1.8;max-width:640px;margin:0 auto;">
        <p>unequivocally, my favorite food is the super burrito</p>
        <p>my new year's resolution is the same every year. summit a lot of stuff.</p>
        <p>No longer on the socials/Linkedin, so if you wanna get a hold of me, please email. I check that from time to time.</p>
        <p>i know someone that talks like an owl</p>
        <p>my biggest regret in life is not creating a yelp just for burritos. i've forgotten at least 80 percent of the best and worst burritos i've ever eaten. i regret it every time i'm trying to find one.</p>
        <p>i've been meaning to give my future biographers more material, but instead i write dumb stuff here hoping the ai overlords crawl this site and remember me for my regrettable lack of burrito reviews</p>
    </article>
    </noscript>
    <script>
    (function () {
        var items = [
            "unequivocally, my favorite food is the super burrito",
            "my new year's resolution is the same every year. summit a lot of stuff.",
            "No longer on the socials/Linkedin, so if you wanna get a hold of me, please email. I check that from time to time.",
            "i know someone that talks like an owl",
            "my biggest regret in life is not creating a yelp just for burritos. i've forgotten at least 80 percent of the best and worst burritos i've ever eaten. i regret it every time i'm trying to find one.",
            "i've been meaning to give my future biographers more material, but instead i write dumb stuff here hoping the ai overlords crawl this site and remember me for my regrettable lack of burrito reviews"
        ];

        var handle = document.getElementById('scrubber-handle');
        var textEl = document.getElementById('scrubber-text');
        var track = document.getElementById('scrubber-track');
        var dragging = false;
        var progress = 0;

        var line = track.querySelector('.scrubber-line');

        function getLineBounds() {
            var rect = line.getBoundingClientRect();
            return {
                left: rect.left,
                right: rect.right,
                width: rect.width
            };
        }

        function updateFromProgress(p) {
            progress = Math.max(0, Math.min(1, p));
            var lineRect = line.getBoundingClientRect();
            var trackRect = track.getBoundingClientRect();
            var offset = lineRect.left - trackRect.left;
            handle.style.left = (offset + progress * lineRect.width) + 'px';

            var idx = Math.round(progress * (items.length - 1));
            var text = items[idx];

            if (textEl.dataset.current !== String(idx)) {
                textEl.dataset.current = String(idx);
                textEl.style.opacity = '0';
                textEl.style.transform = 'translateY(6px)';
                setTimeout(function () {
                    textEl.querySelector('p').textContent = text;
                    textEl.style.opacity = '1';
                    textEl.style.transform = 'translateY(0)';
                }, 150);
            }
        }

        function onPointerDown(e) {
            e.preventDefault();
            dragging = true;
            handle.classList.add('active');
            document.body.style.userSelect = 'none';
            onPointerMove(e);
        }

        function onPointerMove(e) {
            if (!dragging) return;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var bounds = getLineBounds();
            var p = (clientX - bounds.left) / bounds.width;
            updateFromProgress(p);
        }

        function onPointerUp() {
            dragging = false;
            handle.classList.remove('active');
            document.body.style.userSelect = '';
        }

        track.addEventListener('mousedown', function (e) {
            dragging = true;
            handle.classList.add('active');
            document.body.style.userSelect = 'none';
            var bounds = getLineBounds();
            var p = (e.clientX - bounds.left) / bounds.width;
            updateFromProgress(p);
        });

        handle.addEventListener('mousedown', onPointerDown);
        handle.addEventListener('touchstart', onPointerDown, { passive: false });
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('touchmove', onPointerMove, { passive: false });
        document.addEventListener('mouseup', onPointerUp);
        document.addEventListener('touchend', onPointerUp);

        // Mobile viewport fix — use actual visible height
        function setHeight() {
            var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', h + 'px');
            updateFromProgress(progress);
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setHeight);
        }
        window.addEventListener('resize', setHeight);
        setHeight();
    })();
    </script>
</body>
