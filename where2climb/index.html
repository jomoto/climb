<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where2Climb — Find Climbing Destinations by Season</title>
    <meta
      name="description"
      content="Explore climbing destinations around the world by month, climbing style, rock type, and pitch length."
    />
    <meta name="theme-color" content="#141825" />
    <link rel="canonical" href="https://shinojomoto.com/where2climb/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Where2Climb — Find Climbing Destinations by Season" />
    <meta
      property="og:description"
      content="Explore climbing destinations around the world by season, style, rock type, and pitch length."
    />
    <meta property="og:url" content="https://shinojomoto.com/where2climb/" />
    <meta property="og:image" content="https://shinojomoto.com/where2climb/assets/where2climb-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Where2Climb seasonal world climbing map" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Where2Climb — Find Climbing Destinations by Season" />
    <meta
      name="twitter:description"
      content="Explore climbing destinations around the world by season, style, rock type, and pitch length."
    />
    <meta name="twitter:image" content="https://shinojomoto.com/where2climb/assets/where2climb-og.png" />
    <meta name="twitter:image:alt" content="Where2Climb seasonal world climbing map" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css?v=20260929b" />
  </head>
  <body class="map-page">
    <header class="topbar">
      <div class="brand-block">
        <nav class="tool-site-nav" aria-label="Site">
          <a href="../index.html">Shino Jomoto</a>
          <span aria-hidden="true">/</span>
          <a href="../projects.html">Projects</a>
        </nav>
        <h1>Where2Climb</h1>
      </div>

      <label class="primary-month" for="monthSelect">
        <span>When</span>
        <select id="monthSelect" aria-label="Choose month"></select>
      </label>

      <div class="map-actions">
        <button
          class="index-button"
          id="resultsToggle"
          type="button"
          aria-expanded="false"
          aria-controls="resultsPanel"
        >
          <span class="action-label">Area index</span>
          <span id="destinationCount" aria-live="polite" aria-atomic="true">0 areas</span>
        </button>
        <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="topControls">
          <span class="action-label">Filters</span>
          <span class="filter-toggle-mark" aria-hidden="true">+</span>
          <span class="filter-active-count" id="filterActiveCount" hidden>0</span>
        </button>
      </div>
    </header>

    <aside class="filter-sheet" id="topControls" aria-labelledby="filterTitle" hidden>
      <span class="sheet-handle" aria-hidden="true"></span>
      <header class="sheet-header">
        <div>
          <p class="section-index">01 / Refine the map</p>
          <h2 id="filterTitle">Find your season</h2>
        </div>
        <button class="sheet-close" id="filterClose" type="button" aria-label="Close filters">×</button>
      </header>

      <div class="filter-sheet-fields">
        <label class="filter-group sheet-month-group" for="monthSelectSheet">
          <span>Month</span>
          <select id="monthSelectSheet" aria-label="Choose month in filters"></select>
        </label>

        <label class="filter-group" for="styleSelect">
          <span>Climbing</span>
          <select id="styleSelect" aria-label="Choose climbing type">
            <option value="all">Any style</option>
            <option value="sport">Sport</option>
            <option value="trad">Trad</option>
            <option value="boulder">Boulder</option>
            <option value="mixed">Sport &amp; Trad</option>
          </select>
        </label>

        <label class="filter-group" for="rockSelect">
          <span>Rock type</span>
          <select id="rockSelect" aria-label="Choose rock type">
            <option value="all">Any rock</option>
            <option value="granite">Granite</option>
            <option value="limestone">Limestone</option>
            <option value="sandstone">Sandstone</option>
            <option value="volcanic">Volcanic</option>
            <option value="other">Other</option>
          </select>
        </label>

        <div class="filter-group">
          <span>Route length</span>
          <div class="pitch-toggle" id="pitchToggle" role="radiogroup" aria-label="Choose pitch type">
            <button class="pitch-btn active" type="button" role="radio" aria-checked="true" data-pitch="all">Any</button>
            <button class="pitch-btn" type="button" role="radio" aria-checked="false" data-pitch="single">Single</button>
            <button class="pitch-btn" type="button" role="radio" aria-checked="false" data-pitch="multi">Multi</button>
          </div>
        </div>

      </div>

      <footer class="filter-sheet-footer">
        <button class="reset-filters" id="resetFiltersTop" type="button">Clear filters</button>
        <button class="filter-done" id="filterDone" type="button">
          View <span id="filterDoneCount">0 areas</span>
        </button>
      </footer>
    </aside>

    <button class="panel-backdrop" id="panelBackdrop" type="button" aria-label="Close open panel" hidden></button>

    <main class="map-stage" aria-label="Global climbing map">
      <div id="map"></div>

      <aside class="results-panel" id="resultsPanel" aria-labelledby="resultsTitle" hidden>
        <span class="sheet-handle" aria-hidden="true"></span>
        <header class="results-panel-header">
          <div>
            <p class="section-index" id="resultsPanelCount">203 areas</p>
            <h2 id="resultsTitle">Climbing area index</h2>
          </div>
          <button class="panel-close" id="resultsClose" type="button" aria-label="Close destination browser">×</button>
        </header>

        <div class="destination-search">
          <label class="visually-hidden" for="destinationSearch">Search climbing areas</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input
            id="destinationSearch"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="Search area, region, or rock"
          />
          <button class="search-clear" id="searchClear" type="button" aria-label="Clear destination search" hidden>×</button>
        </div>

        <p class="results-summary visually-hidden" id="resultsSummary" aria-live="polite"></p>
        <nav class="destination-list" id="destinationList" aria-label="Filtered destinations"></nav>
        <footer class="results-panel-footer">
          <button class="reset-filters" id="resetFilters" type="button">Clear filters</button>
        </footer>
      </aside>

      <div class="map-empty-state" id="mapEmptyState" hidden>
        <strong>No areas match</strong>
        <span>Try a broader search or clear the filters.</span>
        <button type="button" data-reset-filters>Clear filters</button>
      </div>

      <button class="legend-toggle" id="legendToggle" type="button" aria-expanded="false" aria-controls="mapLegend">
        Map key
      </button>
      <div class="map-legend" id="mapLegend" aria-label="Marker legend">
        <p>Map key</p>
        <div class="legend-items" id="legendItems">
          <span><i class="dot dot-sport"></i> Sport</span>
          <span><i class="dot dot-trad"></i> Trad</span>
          <span><i class="dot dot-boulder"></i> Boulder</span>
          <span><i class="dot dot-mixed"></i> Sport &amp; Trad</span>
        </div>
      </div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script
      src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
      crossorigin=""
    ></script>
    <script type="module" src="./app.js?v=23"></script>
  </body>
</html>
