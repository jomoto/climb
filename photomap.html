<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #photomap {
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }

        /* Custom marker */
        .photo-marker {
            background: none;
            border: none;
        }

        .marker-dot {
            width: 14px;
            height: 14px;
            background: #4A6B8A;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(27, 25, 22, 0.3);
            transition: transform 150ms ease;
            cursor: pointer;
        }

        .marker-dot:hover {
            transform: scale(1.3);
        }

        /* Cluster styling — slate blue */
        .marker-cluster {
            background: rgba(74, 107, 138, 0.3);
        }

        .marker-cluster div {
            background: #4A6B8A;
            color: #fff;
            font-family: "Franklin Gothic Medium", "Franklin Gothic", Arial, sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
        }

        .marker-cluster-small {
            background: rgba(74, 107, 138, 0.3);
        }

        .marker-cluster-small div {
            background: #4A6B8A;
        }

        .marker-cluster-medium {
            background: rgba(61, 90, 117, 0.35);
        }

        .marker-cluster-medium div {
            background: #3D5A75;
        }

        .marker-cluster-large {
            background: rgba(51, 77, 102, 0.4);
        }

        .marker-cluster-large div {
            background: #334D66;
        }

        /* Popup styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(27, 25, 22, 0.15);
            padding: 0;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0;
            padding: 0;
        }

        .leaflet-popup-tip {
            background: #fff;
        }

        .photo-popup {
            width: 280px;
        }

        .photo-popup a {
            display: block;
        }

        .photo-popup img {
            width: 280px;
            height: 200px;
            display: block;
            object-fit: cover;
            background: #f6f1e8;
        }

        .photo-popup .popup-body {
            padding: 10px 14px 12px;
        }

        .photo-popup .popup-title {
            font-family: "Franklin Gothic Medium", "Franklin Gothic", "ITC Franklin Gothic", "Arial Narrow", Arial, sans-serif;
            font-size: 0.95rem;
            margin: 0;
            color: #1b1916;
        }

        /* Tour navigation */
        .popup-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px 10px;
        }

        .popup-nav button {
            background: none;
            border: 1px solid rgba(74, 107, 138, 0.25);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #4A6B8A;
            padding: 4px 10px;
            font-family: "Franklin Gothic Medium", "Franklin Gothic", Arial, sans-serif;
            transition: background 150ms ease, color 150ms ease;
        }

        .popup-nav button:hover {
            background: #4A6B8A;
            color: #fff;
        }

        .popup-hint {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.65rem;
            color: #9aa5b0;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <div id="photomap"></div>
    <script>
    (function () {
        'use strict';

        // ── Configuration ──────────────────────────────────
        var R2_BASE_URL = 'https://pub-d42396f675434597b9696afabeeaf051.r2.dev';
        var CSV_PATH = 'photos.csv';
        var USE_THUMBNAILS = true;

        // ── Map initialization ─────────────────────────────
        var map = L.map('photomap', {
            center: [20, -30],
            zoom: 3,
            zoomControl: true,
            scrollWheelZoom: true
        });

        L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
            {
                attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }
        ).addTo(map);

        // ── Marker cluster group ───────────────────────────
        var clusterGroup = L.markerClusterGroup({
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true,
            maxClusterRadius: 30,
            spiderfyDistanceMultiplier: 2
        });
        map.addLayer(clusterGroup);

        // ── Custom marker icon ─────────────────────────────
        function createMarkerIcon() {
            return L.divIcon({
                className: 'photo-marker',
                html: '<div class="marker-dot"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7],
                popupAnchor: [0, -10]
            });
        }

        // ── CSV parsing ────────────────────────────────────
        function parseCSVLine(line) {
            var result = [];
            var current = '';
            var inQuotes = false;
            for (var i = 0; i < line.length; i++) {
                var ch = line[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (i + 1 < line.length && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        current += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        result.push(current);
                        current = '';
                    } else {
                        current += ch;
                    }
                }
            }
            result.push(current);
            return result;
        }

        function parseCSV(text) {
            var lines = text.trim().split('\n');
            var headers = parseCSVLine(lines[0]);
            var rows = [];
            for (var i = 1; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var values = parseCSVLine(line);
                var obj = {};
                for (var j = 0; j < headers.length; j++) {
                    obj[headers[j].trim()] = (values[j] || '').trim();
                }
                rows.push(obj);
            }
            return rows;
        }

        // ── HTML escaping ──────────────────────────────────
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Tour state ─────────────────────────────────────
        var allMarkers = [];     // { marker, lat, lon, row }
        var tourNeighbors = [];  // sorted by distance from current
        var tourIndex = 0;
        var tourActive = false;
        var navigating = false;  // true while tour nav is in progress

        function distanceSq(lat1, lon1, lat2, lon2) {
            var dLat = lat2 - lat1;
            var dLon = lon2 - lon1;
            return dLat * dLat + dLon * dLon;
        }

        function buildTourFrom(entry) {
            var lat = entry.lat;
            var lon = entry.lon;
            tourNeighbors = allMarkers.slice().sort(function (a, b) {
                return distanceSq(lat, lon, a.lat, a.lon) - distanceSq(lat, lon, b.lat, b.lon);
            });
            // Find current in sorted list (it'll be index 0 since distance = 0)
            tourIndex = 0;
            tourActive = true;
        }

        function navigateTour(direction) {
            if (!tourActive || tourNeighbors.length === 0) return;
            tourIndex += direction;
            if (tourIndex < 0) tourIndex = tourNeighbors.length - 1;
            if (tourIndex >= tourNeighbors.length) tourIndex = 0;

            var next = tourNeighbors[tourIndex];
            navigating = true;
            map.closePopup();

            // Fly to marker and open popup
            map.flyTo([next.lat, next.lon], Math.max(map.getZoom(), 10), {
                duration: 0.8
            });

            // Wait for fly animation, then open popup
            setTimeout(function () {
                // Spiderfy the cluster if needed
                clusterGroup.zoomToShowLayer(next.marker, function () {
                    next.marker.openPopup();
                });
            }, 900);
        }

        // ── Keyboard navigation ────────────────────────────
        document.addEventListener('keydown', function (e) {
            if (!tourActive) return;
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                navigateTour(1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                navigateTour(-1);
            }
        });

        // ── Marker creation ────────────────────────────────
        function createMarker(row) {
            var lat = parseFloat(row.lat);
            var lon = parseFloat(row.lon);
            if (isNaN(lat) || isNaN(lon)) return null;

            var filename = row.photo_filename;
            var thumbFile = USE_THUMBNAILS
                ? filename.replace(/(\.\w+)$/, '-thumb$1')
                : filename;
            var imgUrl = R2_BASE_URL + '/' + thumbFile;
            var fullUrl = R2_BASE_URL + '/' + filename;
            var title = escapeHtml(row.title);

            var hintHtml = '<span class="popup-hint">explore nearby</span>';

            var popupHtml = '<div class="photo-popup">' +
                '<a href="' + fullUrl + '" target="_blank" rel="noreferrer">' +
                '<img src="' + imgUrl + '" alt="' + title + '">' +
                '</a>' +
                '<div class="popup-body">' +
                '<p class="popup-title">' + title + '</p>' +
                '</div>' +
                '<div class="popup-nav">' +
                '<button class="tour-prev">\u2190 prev</button>' +
                hintHtml +
                '<button class="tour-next">next \u2192</button>' +
                '</div>' +
                '</div>';

            var marker = L.marker([lat, lon], { icon: createMarkerIcon() });
            marker.bindPopup(popupHtml, { maxWidth: 300, minWidth: 280 });

            var entry = { marker: marker, lat: lat, lon: lon, row: row };
            allMarkers.push(entry);

            marker.on('popupopen', function () {
                // Only rebuild tour if user manually clicked a pin
                if (navigating) {
                    navigating = false;
                } else {
                    buildTourFrom(entry);
                }

                // Attach click handlers to nav buttons
                var popup = marker.getPopup().getElement();
                if (popup) {
                    var prevBtn = popup.querySelector('.tour-prev');
                    var nextBtn = popup.querySelector('.tour-next');
                    if (prevBtn) {
                        prevBtn.addEventListener('click', function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                            navigateTour(-1);
                        });
                    }
                    if (nextBtn) {
                        nextBtn.addEventListener('click', function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                            navigateTour(1);
                        });
                    }
                }
            });

            marker.on('popupclose', function () {
                // Keep tour active briefly so keyboard nav still works
                // Tour resets when a new marker is manually clicked
            });

            return marker;
        }

        // ── Load data and create markers ───────────────────
        fetch(CSV_PATH)
            .then(function (response) {
                if (!response.ok) throw new Error('Failed to load ' + CSV_PATH);
                return response.text();
            })
            .then(function (text) {
                var rows = parseCSV(text);
                rows.forEach(function (row) {
                    var marker = createMarker(row);
                    if (marker) clusterGroup.addLayer(marker);
                });
            })
            .catch(function (err) {
                console.error('Photo map error:', err);
            });
    })();
    </script>
</body>
</html>
