<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #photomap {
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }

        /* Custom marker */
        .photo-marker {
            background: none;
            border: none;
        }

        .marker-dot {
            width: 14px;
            height: 14px;
            background: #c9a24c;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(27, 25, 22, 0.3);
            transition: transform 150ms ease;
            cursor: pointer;
        }

        .marker-dot:hover {
            transform: scale(1.3);
        }

        /* Cluster styling to match site aesthetic */
        .marker-cluster {
            background: rgba(201, 162, 76, 0.3);
        }

        .marker-cluster div {
            background: #c9a24c;
            color: #fff;
            font-family: "Franklin Gothic Medium", "Franklin Gothic", Arial, sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
        }

        .marker-cluster-small {
            background: rgba(201, 162, 76, 0.3);
        }

        .marker-cluster-small div {
            background: #c9a24c;
        }

        .marker-cluster-medium {
            background: rgba(164, 124, 47, 0.35);
        }

        .marker-cluster-medium div {
            background: #a47c2f;
        }

        .marker-cluster-large {
            background: rgba(143, 106, 58, 0.4);
        }

        .marker-cluster-large div {
            background: #8f6a3a;
        }

        /* Popup styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(27, 25, 22, 0.15);
            padding: 0;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0;
            padding: 0;
        }

        .leaflet-popup-tip {
            background: #fff;
        }

        .photo-popup {
            width: 280px;
        }

        .photo-popup a {
            display: block;
        }

        .photo-popup img {
            width: 280px;
            height: 200px;
            display: block;
            object-fit: cover;
            background: #f6f1e8;
        }

        .photo-popup .popup-body {
            padding: 10px 14px 12px;
        }

        .photo-popup .popup-title {
            font-family: "Franklin Gothic Medium", "Franklin Gothic", "ITC Franklin Gothic", "Arial Narrow", Arial, sans-serif;
            font-size: 0.95rem;
            margin: 0;
            color: #1b1916;
        }
    </style>
</head>
<body>
    <div id="photomap"></div>
    <script>
    (function () {
        'use strict';

        // ── Configuration ──────────────────────────────────
        var R2_BASE_URL = 'https://pub-d42396f675434597b9696afabeeaf051.r2.dev';
        var CSV_PATH = 'photos.csv';
        var USE_THUMBNAILS = true;

        // ── Map initialization ─────────────────────────────
        var map = L.map('photomap', {
            center: [20, -30],
            zoom: 3,
            zoomControl: true,
            scrollWheelZoom: true
        });

        L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            {
                attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }
        ).addTo(map);

        // ── Marker cluster group ───────────────────────────
        var clusterGroup = L.markerClusterGroup({
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true,
            maxClusterRadius: 30,
            spiderfyDistanceMultiplier: 2
        });
        map.addLayer(clusterGroup);

        // ── Custom marker icon ─────────────────────────────
        function createMarkerIcon() {
            return L.divIcon({
                className: 'photo-marker',
                html: '<div class="marker-dot"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7],
                popupAnchor: [0, -10]
            });
        }

        // ── CSV parsing ────────────────────────────────────
        function parseCSVLine(line) {
            var result = [];
            var current = '';
            var inQuotes = false;
            for (var i = 0; i < line.length; i++) {
                var ch = line[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (i + 1 < line.length && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        current += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        result.push(current);
                        current = '';
                    } else {
                        current += ch;
                    }
                }
            }
            result.push(current);
            return result;
        }

        function parseCSV(text) {
            var lines = text.trim().split('\n');
            var headers = parseCSVLine(lines[0]);
            var rows = [];
            for (var i = 1; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var values = parseCSVLine(line);
                var obj = {};
                for (var j = 0; j < headers.length; j++) {
                    obj[headers[j].trim()] = (values[j] || '').trim();
                }
                rows.push(obj);
            }
            return rows;
        }

        // ── HTML escaping ──────────────────────────────────
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Marker creation ────────────────────────────────
        function createMarker(row) {
            var lat = parseFloat(row.lat);
            var lon = parseFloat(row.lon);
            if (isNaN(lat) || isNaN(lon)) return null;

            var filename = row.photo_filename;
            var thumbFile = USE_THUMBNAILS
                ? filename.replace(/(\.\w+)$/, '-thumb$1')
                : filename;
            var imgUrl = R2_BASE_URL + '/' + thumbFile;
            var fullUrl = R2_BASE_URL + '/' + filename;
            var title = escapeHtml(row.title);

            var popupHtml = '<div class="photo-popup">' +
                '<a href="' + fullUrl + '" target="_blank" rel="noreferrer">' +
                '<img src="' + imgUrl + '" alt="' + title + '">' +
                '</a>' +
                '<div class="popup-body">' +
                '<p class="popup-title">' + title + '</p>' +
                '</div></div>';

            var marker = L.marker([lat, lon], { icon: createMarkerIcon() });
            marker.bindPopup(popupHtml, { maxWidth: 300, minWidth: 280 });
            return marker;
        }

        // ── Load data and create markers ───────────────────
        fetch(CSV_PATH)
            .then(function (response) {
                if (!response.ok) throw new Error('Failed to load ' + CSV_PATH);
                return response.text();
            })
            .then(function (text) {
                var rows = parseCSV(text);
                rows.forEach(function (row) {
                    var marker = createMarker(row);
                    if (marker) clusterGroup.addLayer(marker);
                });
            })
            .catch(function (err) {
                console.error('Photo map error:', err);
            });
    })();
    </script>
</body>
</html>
